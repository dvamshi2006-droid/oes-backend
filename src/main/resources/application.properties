# Server Configuration
server.port=${PORT:8080}
server.servlet.context-path=/

# Database Configuration (supports PostgreSQL, MySQL, and H2)
# If Render DATABASE_URL is set, DataSourceConfig automatically handles it.
# Otherwise, falls back to DB_URL / spring.datasource.*
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/online_exam?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT Configuration
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-milliseconds=${JWT_EXPIRATION:86400000}

# CORS Configuration (Production Vercel frontend + local dev)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://oes-frontend-one.vercel.app,http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000}

# Logging
logging.level.com.example.examination=INFO
logging.level.org.springframework.security=WARN
